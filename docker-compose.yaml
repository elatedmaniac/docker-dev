version: '3.8'
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token ${CLOUDFLARE_TOKEN}
    container_name: cloudflared
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.18.0.2
  drawio:
    image: jgraph/drawio:latest
    container_name: drawio_container
    environment:
      - PUBLIC_DNS=drawio.elatedmaniac.io
      - LETS_ENCRYPT_ENABLED=true
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.18.0.3
  anaconda:
    build:
      context: .
      dockerfile: jupyter/Dockerfile
      args:
        CERTIFICATE_OU: ${CERTIFICATE_OU}
    container_name: anaconda_container
    volumes:
      - ./jupyter/data:/workspace/data
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - JUPYTER_PASSWORD=${JUPYTER_PASSWORD}
      - CERTIFICATE_OU=${CERTIFICATE_OU}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    #restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.18.0.4
  neo4j:
    build:
      context: ./neo4j
      args:
        NEO4J_AUTH: ${NEO4J_AUTH}
        CERTIFICATE_OU: ${CERTIFICATE_OU}
    container_name: neo4j_container
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=${NEO4J_PLUGINS}
      - CERTIFICATE_OU=${CERTIFICATE_OU}
    volumes:
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import
      - ./neo4j/plugins:/plugins
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.18.0.5
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    # volumes:
    #   - ./nginx/certificates:/etc/nginx/certificates
    depends_on:
      - anaconda
      - drawio
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.18.0.6
  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    container_name: streamlit
    environment:
      - PHI3_AGENT_URL=http://phi3:11434
      - CODEGEMMA_AGENT_URL=http://codegemma:11434
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit/app:/app
      - ./streamlit/app/.streamlit:/root/.streamlit 
    depends_on:
      - phi3
      - codegemma
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.18.0.7
  phi3:
    build:
      context: .
      dockerfile: ollama/Dockerfile
      args:
      - MODEL=${MODEL:-phi3:3.8b} 
    container_name: phi3
    environment:
      - MODEL=${MODEL:-phi3:3.8b}
    volumes:
      - ./ollama/data:/root/.ollama  
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      default:
        ipv4_address: 172.18.0.9
  codegemma:
    build:
      context: .
      dockerfile: ollama/Dockerfile
      args:
      - MODEL=${MODEL:-codegemma:latest} 
    container_name: codegemma
    environment:
      - MODEL=${MODEL:-codegemma:latest}
    volumes:
      - ./ollama/data:/root/.ollama  
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      default:
        ipv4_address: 172.18.0.10
  embeddings:
    build:
      context: .
      dockerfile: ollama/Dockerfile
      args:
      - MODEL=${MODEL:-nomic-embed-text} 
    container_name: embeddings
    environment:
      - MODEL=${MODEL:-nomic-embed-text}
    volumes:
      - ./embeddings/data:/root/.ollama  
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "http://localhost:11434/api/tags"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      default:
        ipv4_address: 172.18.0.11

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
